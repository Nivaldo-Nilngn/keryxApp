name: keryx_app
description: "Bíblia, livros e sermões em um só lugar."
publish_to: 'none'
version: 2.0.2+11

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  scrollable_positioned_list: ^0.3.8
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_riverpod: ^2.5.1
  flutter_svg: ^2.0.10+1
  animations: ^2.0.11
  http: ^1.6.0
  dio: ^5.4.3
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.2
  xml: ^6.6.1
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2
  syncfusion_flutter_pdfviewer: ^32.2.8
  flutter_tts: ^4.2.1
  wakelock_plus: ^1.3.4
  google_generative_ai: ^0.4.7
  flutter_markdown: ^0.7.3
  translator: ^1.0.4+1
  sqflite_sqlcipher: ^3.4.1
  path: ^1.9.1
  path_provider: ^2.1.6
  flutter_quill: ^11.6.0
  get_it: ^9.2.1
  flutter_localizations:
    sdk: flutter
  flutter_html: ^3.0.0
  sqflite_common_ffi: ^2.4.0+2
  sqflite_common_ffi_web: ^1.1.1
  audioplayers: ^6.6.0
  share_plus: ^12.0.2
  flutter_dotenv: ^5.1.0

  syncfusion_flutter_pdf: any
  google_sign_in: ^6.2.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  flutter_quill_to_pdf: ^2.3.9
  pdf: ^3.12.0
  cached_network_image: ^4.0.3
  pdfx: ^2.11.0
  html: ^0.15.6
  webview_flutter: ^4.14.1
  tdlib:
    path: ./tdlib_local
  permission_handler: ^13.0.2
  rxdart: ^0.28.0
  device_info_plus: ^12.4.0
  cloud_functions: ^5.6.2
  archive: ^4.0.9
  file_picker: ^11.0.3

  image: any
  intl: any
  markdown: any
  sqlite3: ^3.7.0
  package_info_plus: ^9.0.1
  open_filex: ^5.0.0
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  build_runner: ^2.12.2
  freezed: ^3.2.5
  json_serializable: ^6.13.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  remove_alpha_ios: true
  image_path: "assets/img/logo.png"
  min_sdk_size: 21

flutter:
  uses-material-design: true
  assets:
    - assets/bible/
    - assets/bible/bibles/
    - assets/bible/commentaries/
    - assets/bible/dictionaries/
    - assets/bible/books/
    - assets/bible/sql/
    - assets/img/
    - assets/database/
    - assets/pdf/
    - assets/data/
    - assets/data/plans/
    - .env

dependency_overrides:
  html: 0.15.6
