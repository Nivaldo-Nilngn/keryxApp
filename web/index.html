<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Keryx - Aplicativo completo de estudo bíblico, esboços, comentários e teologia.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- PWA & Mobile Web Capabilities -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KeryxApp">
  <meta name="application-name" content="KeryxApp">
  <meta name="theme-color" content="#111223">
  <meta name="msapplication-TileColor" content="#111223">

  <!-- Apple Touch Icons (iOS Home Screen) -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152x152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167x167.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180x180.png">

  <!-- Favicon & Manifest -->
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="manifest" href="manifest.json">

  <title>Keryx - Estudo Bíblico</title>
  <meta name="google-signin-client_id" content="809342545607-mdbs8b13gdo81et56rf4k9rf75ibkdcs.apps.googleusercontent.com">

  <!-- Firebase JS SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
  
  <!-- Google Sign-In Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Forçar renderizador HTML para evitar crashes de memória no CanvasKit/WASM -->
  <meta name="flutter-web-renderer" content="html">

  <style>
    body {
      background-color: #111223;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1b1c34 0%, #111223 100%);
      z-index: 99999;
      transition: opacity 0.4s ease-out;
    }
    .loading-logo {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      animation: pulse 2s infinite ease-in-out;
    }
    .loading-title {
      margin-top: 20px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #F5E6C8;
    }
    .loading-spinner {
      margin-top: 24px;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(242, 202, 80, 0.2);
      border-top-color: #F2CA50;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.04); opacity: 1; }
    }
  </style>
</head>

<body>
  <div id="loading-container">
    <img src="icons/Icon-192.png" alt="Keryx" class="loading-logo" />
    <div class="loading-title">KERYX</div>
    <div class="loading-spinner"></div>
  </div>

  <script src='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs' type='module'></script>
  <script type='module'>
  var { pdfjsLib } = globalThis;
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.mjs';

  var pdfRenderOptions = {
    cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/cmaps/',
    cMapPacked: true,
  }
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          loader.remove();
        }, 400);
      }
    });
  </script>
</body>

</html>
